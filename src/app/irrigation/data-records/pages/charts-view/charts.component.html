<div class="p-10">
  <div class="mb-6">
    <nz-radio-group [(ngModel)]="selectedOption" (ngModelChange)="this.getFilteredSensorData()" nzButtonStyle="solid">
      <label *ngFor="let zone of zones" nz-radio-button [nzValue]="zone.name">{{ zone.name.toUpperCase() }}</label>
    </nz-radio-group>
  </div>

  <div class="mb-6">
    <nz-radio-group [(ngModel)]="dateSelectedOption" (ngModelChange)="this.getFilteredSensorData()" nzButtonStyle="solid">
      <label *ngFor="let date of dateFilter" nz-radio-button [nzValue]="date">{{ date.toUpperCase() }}</label>
    </nz-radio-group>
  </div>

  <div class="grid grid-cols-2 gap-6">
    <nz-card nzTitle="Water Consumption" class="shadow-lg">
      <div *ngIf="waterUsageChart[0]">
        <ngx-charts-line-chart
          [view]="view"
          [scheme]="colorScheme"
          [showXAxisLabel]="showXAxisLabel"
          [xAxis]="xAxis"
          [yAxis]="yAxis"
          [xAxisLabel]="xAxisLabel"
          [autoScale]="true"
          [yAxisLabel]="'Water Consumption'"
          [timeline]="timeline"
          [results]="waterUsageChart"
        >
        </ngx-charts-line-chart>
      </div>
      <div *ngIf="!waterUsageChart[0]">
        <p>There is not enough data available to generate the chart</p>
      </div>
    </nz-card>

    <nz-card nzTitle="Soil Moisture" class="shadow-lg">
      <div *ngIf="moistureChart[0]">
        <ngx-charts-line-chart
          [view]="view"
          [scheme]="colorScheme"
          [showXAxisLabel]="showXAxisLabel"
          [xAxis]="xAxis"
          [yAxis]="yAxis"
          [xAxisLabel]="xAxisLabel"
          [autoScale]="true"
          [yAxisLabel]="'Humedad del suelo'"
          [timeline]="timeline"
          [results]="moistureChart"
        >
        </ngx-charts-line-chart>
      </div>
      <div *ngIf="!moistureChart[0]">
        <p>There is not enough data available to generate the chart</p>
      </div>
    </nz-card>

    <nz-card nzTitle="Air Humidity" class="shadow-lg">
      <div *ngIf="humidityChart[0]">
        <ngx-charts-line-chart
          [view]="view"
          [scheme]="colorScheme"
          [showXAxisLabel]="showXAxisLabel"
          [xAxis]="xAxis"
          [yAxis]="yAxis"
          [xAxisLabel]="xAxisLabel"
          [autoScale]="true"
          [yAxisLabel]="'Air Humidity'"
          [timeline]="timeline"
          [results]="humidityChart"
        >
        </ngx-charts-line-chart>
      </div>
      <div *ngIf="!humidityChart[0]">
        <p>There is not enough data available to generate the chart</p>
      </div>
    </nz-card>

    <nz-card nzTitle="Air Temperature" class="shadow-lg">
      <div *ngIf="temperatureChart[0]">
        <ngx-charts-line-chart
          [view]="view"
          [scheme]="colorScheme"
          [showXAxisLabel]="showXAxisLabel"
          [xAxis]="xAxis"
          [yAxis]="yAxis"
          [xAxisLabel]="xAxisLabel"
          [autoScale]="true"
          [yAxisLabel]="'Air Temperature'"
          [timeline]="timeline"
          [results]="temperatureChart"
        >
        </ngx-charts-line-chart>
      </div>
      <div *ngIf="!temperatureChart[0]">
        <p>There is not enough data available to generate the chart</p>
      </div>
    </nz-card>
  </div>
</div>
