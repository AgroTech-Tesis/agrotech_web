<div class="p-10">
  <div class="justify-center w-full" *ngIf="deviceData.length != 0">
    <nz-collapse>
      <nz-collapse-panel *ngFor="let device of deviceData" [nzHeader]="deviceHeader" [nzExtra]="deviceExtra">
        <ng-template #deviceHeader>
          <div class="grid grid-cols-4 w-full gap-4">
            <div class="font-semibold">{{device.deviceName}}</div>
            <div>{{device.media}}</div>
            <div>{{formatDateTime(device.createdAt)}}</div>
            <div>
              <nz-tag [nzColor]="device.status === 'ONLINE' ? 'success' : device.status === 'FAIL' ? 'error' : 'default'">
                {{device.status}}
              </nz-tag>
            </div>
          </div>
        </ng-template>
        <ng-template #deviceExtra>
          <span nz-icon nzType="down" nzTheme="outline"></span>
        </ng-template>
        <nz-divider></nz-divider>
        <div class="p-4">
          <div *ngIf="device.media === '-'; else deviceComponents">
            <p class="font-semibold mb-2">Actuadores:</p>
            <ul class="list-disc pl-6">
              <li>Water Pump</li>
            </ul>
          </div>
          <ng-template #deviceComponents>
            <p class="font-semibold mb-2">Sensors:</p>
            <ul class="list-disc pl-6">
              <li>Caudal</li>
              <li>Air Temperature</li>
              <li>Air Humidity</li>
              <li>Soil Moisture</li>
            </ul>
          </ng-template>
        </div>
      </nz-collapse-panel>
    </nz-collapse>
  </div>
  <div *ngIf="deviceData.length == 0" class="w-full text-center">
    <div class="image">
    </div>
    <div class="message">
      <h1>There are no devices to display</h1>
    </div>
  </div>
</div>
